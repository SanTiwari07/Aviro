[project]
name = "arivo"
version = "0.1.0"
description = "ARIVO — AI Finance Controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.3",
    "pandas>=2.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "W605"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.vercel]
entrypoint = "backend.main:app"

