name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest ruff
        
    - name: Lint Python
      run: |
        ruff check backend/
        
    - name: Generate Benchmark Dataset
      run: |
        python dataset/generate_dataset.py --rows 5000 --seed 20260902
        python dataset/validate_dataset.py
        
    - name: Test Python
      run: |
        PYTHONPATH=$PYTHONPATH:. pytest backend/tests/
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install
        
    - name: Typecheck Frontend
      run: |
        cd frontend
        npm run typecheck
